# bridal-app のテストを、develop・main 向けの PR ごとに GitHub で実行する。
# ここで通った印（チェック名 bridal-app-test）が、ブランチの保護で「取り込みに必要なチェック」になっている。
# 通ると、自動取り込みを予約した develop 向けの PR は、GitHub がそのまま取り込む。
name: bridal-app-test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: bridal-app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridal-app-test:
    name: bridal-app-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridal-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: テストを実行する
        run: sh ./mvnw -q -B test
