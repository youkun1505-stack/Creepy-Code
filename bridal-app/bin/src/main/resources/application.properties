# =========================================
# bridal-app 設定ファイル（全員共通・Git で共有する）
# 個人で変える値・秘密の値（DB の接続情報・AI のモード）は環境変数から読む
# =========================================

# アプリ名
spring.application.name=bridal-app
# 起動するポート番号（http://localhost:8080）
server.port=8080
# 画面（Thymeleaf）を保存したらすぐ反映させる（開発用）
spring.thymeleaf.cache=false

# --- DB 接続（Supabase の PostgreSQL。チーム全員で1つのプロジェクトを共有する） ---
# このリポジトリは公開されているので、接続情報はここには絶対に書かない（環境変数から読む）
# 接続先（環境変数 DB_URL）：Supabase の「Session pooler」の値を使う
#   例）jdbc:postgresql://aws-0-<リージョン>.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
# ユーザー名（環境変数 DB_USERNAME）　例）postgres.<プロジェクトID>
spring.datasource.username=${DB_USERNAME}
# パスワード（環境変数 DB_PASSWORD）
spring.datasource.password=${DB_PASSWORD}
# PostgreSQL の JDBC ドライバ
spring.datasource.driver-class-name=org.postgresql.Driver
# テーブルを置くスキーマ（db/00_create_schema.sql で作る。public は使わない）
spring.datasource.hikari.schema=creepy
# 1人が同時に使う接続の数。Supabase は全員の合計に上限があるので少なくしておく
spring.datasource.hikari.maximum-pool-size=2

# --- JPA ---
# テーブルは SQL ファイルで作る。JPA に勝手にテーブルを作らせない
spring.jpa.hibernate.ddl-auto=none
# 実行した SQL をコンソールに表示する（開発用）
spring.jpa.show-sql=true
# 画面を作り終わるまで DB の接続をつかんだままにしない
# （接続は1人2本までなので、AI の返事を待つ間ずっとつかんでいると足りなくなる）
spring.jpa.open-in-view=false

# --- ファイルアップロード（基本設計書 8-3） ---
# 1ファイルの上限サイズ
spring.servlet.multipart.max-file-size=10MB
# 1回の送信の上限サイズ
spring.servlet.multipart.max-request-size=10MB

# --- セッション（基本設計書 8-2） ---
# 30分操作がなければログアウトする
server.servlet.session.timeout=30m

# --- ログイン（別担当が作成中） ---
# ログイン機能ができるまでは、Spring Security を止めておく（止めないと、全画面に標準のログイン画面が出てしまう）
# TODO: ログイン機能を入れるときに、この行を削除する
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# ログイン機能ができるまで、AI深掘り質問（P-10）で「ログイン中の顧客」の代わりに使う USER_ID
# 初期値の 1 はテスト用の顧客（db/03_insert_testdata.sql）
app.hearing.dev-user-id=${APP_DEV_USER_ID:1}

# --- ファイル保存先（S3 の代わり） ---
# 添付ファイル・会話履歴 md の保存フォルダ
app.storage.dir=./uploads

# --- AI（Sign in with ChatGPT） ---
# API キーは使わない。ChatGPT のアカウントでサインインし、その人のプラン（Plus / Pro）の利用枠で AI を呼ぶ
# サインインと AI の呼び出しは、中継プログラム（ai-relay フォルダ。Node.js）が行う
# dummy：固定の文章を返す／chatgpt：サインインした ChatGPT のプランで本物の AI を呼ぶ（環境変数 APP_AI_MODE、初期値 dummy）
app.ai.mode=${APP_AI_MODE:dummy}
# AI 用の中継プログラム（ai-relay フォルダ）の呼び出し先。chatgpt モードのときに使う
app.ai.relay-url=${APP_AI_RELAY_URL:http://127.0.0.1:8787}
