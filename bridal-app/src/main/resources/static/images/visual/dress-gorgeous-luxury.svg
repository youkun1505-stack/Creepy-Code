<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="衣装｜ラグジュアリー（仮の画像）" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- かんたん質問 STEP2 の仮の画像。本物の写真に差し替えるまで使う -->
  <rect width="800" height="600" fill="#f7f1e2"/>
  <rect x="0" y="0" width="800" height="24" fill="#b3933f"/>
  <rect x="40" y="64" width="720" height="472" rx="24" fill="none" stroke="#b3933f" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="400" y="260" text-anchor="middle" font-family="'Zen Old Mincho','Yu Mincho',serif" font-size="48" font-weight="700" fill="#b3933f">衣装｜ラグジュアリー</text>
  <text x="400" y="330" text-anchor="middle" font-family="'Zen Kaku Gothic New','Yu Gothic',sans-serif" font-size="30" fill="#333333">ビーズ・刺繍のきらめくドレス</text>
  <text x="400" y="470" text-anchor="middle" font-family="'Zen Kaku Gothic New','Yu Gothic',sans-serif" font-size="24" fill="#6c757d">仮の画像（あとで写真に差し替えます）</text>
