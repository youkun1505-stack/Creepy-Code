# =========================================
# bridal-app 設定ファイル（全員共通・Git で共有する）
# 個人で変える値（AI のモード・API キー）は環境変数から読む
# =========================================

# アプリ名
spring.application.name=bridal-app
# 起動するポート番号（http://localhost:8080）
server.port=8080
# 画面（Thymeleaf）を保存したらすぐ反映させる（開発用）
spring.thymeleaf.cache=false

# --- DB 接続（Supabase の PostgreSQL。チーム全員で1つのプロジェクトを共有する） ---
# このリポジトリは公開されているので、接続情報はここには絶対に書かない（環境変数から読む）
# 接続先（環境変数 DB_URL）：Supabase の「Session pooler」の値を使う
#   例）jdbc:postgresql://aws-0-<リージョン>.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
# ユーザー名（環境変数 DB_USERNAME）　例）postgres.<プロジェクトID>
spring.datasource.username=${DB_USERNAME}
# パスワード（環境変数 DB_PASSWORD）
spring.datasource.password=${DB_PASSWORD}
# PostgreSQL の JDBC ドライバ
spring.datasource.driver-class-name=org.postgresql.Driver
# テーブルを置くスキーマ（db/00_create_schema.sql で作る。public は使わない）
spring.datasource.hikari.schema=creepy
# 1人が同時に使う接続の数。Supabase は全員の合計に上限があるので少なくしておく
spring.datasource.hikari.maximum-pool-size=2

# --- JPA ---
# テーブルは SQL ファイルで作る。JPA に勝手にテーブルを作らせない
spring.jpa.hibernate.ddl-auto=none
# 実行した SQL をコンソールに表示する（開発用）
spring.jpa.show-sql=true

# --- ファイルアップロード（基本設計書 8-3） ---
# 1ファイルの上限サイズ
spring.servlet.multipart.max-file-size=10MB
# 1回の送信の上限サイズ
spring.servlet.multipart.max-request-size=10MB

# --- セッション（基本設計書 8-2） ---
# 30分操作がなければログアウトする
server.servlet.session.timeout=30m

# --- ファイル保存先（S3 の代わり） ---
# 添付ファイル・会話履歴 md の保存フォルダ
app.storage.dir=./uploads

# --- AI（Gemini API） ---
# dummy：固定の文章を返す／api：本物の Gemini API を呼ぶ（環境変数 APP_AI_MODE、初期値 dummy）
app.ai.mode=${APP_AI_MODE:dummy}
# Gemini API のキー（環境変数 GEMINI_API_KEY。ここには絶対に書かない）
app.ai.api-key=${GEMINI_API_KEY:}
