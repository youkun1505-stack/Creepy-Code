# =========================================
# bridal-app 設定ファイル（全員共通・Git で共有する）
# 個人で変える値（AI のモード・API キー）は環境変数から読む
# =========================================

# アプリ名
spring.application.name=bridal-app
# 起動するポート番号（http://localhost:8080）
server.port=8080
# 画面（Thymeleaf）を保存したらすぐ反映させる（開発用）
spring.thymeleaf.cache=false

# --- DB 接続（全員同じ値） ---
# 接続先：Docker 上の Oracle XE の XEPDB1
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
# このプロジェクト専用のユーザー（スキーマ）
spring.datasource.username=CREEPY
# CREEPY ユーザーのパスワード
spring.datasource.password=creepycode
# Oracle の JDBC ドライバ
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- JPA ---
# テーブルは SQL ファイルで作る。JPA に勝手にテーブルを作らせない
spring.jpa.hibernate.ddl-auto=none
# 実行した SQL をコンソールに表示する（開発用）
spring.jpa.show-sql=true

# --- ファイルアップロード（基本設計書 8-3） ---
# 1ファイルの上限サイズ
spring.servlet.multipart.max-file-size=10MB
# 1回の送信の上限サイズ
spring.servlet.multipart.max-request-size=10MB

# --- セッション（基本設計書 8-2） ---
# 30分操作がなければログアウトする
server.servlet.session.timeout=30m

# --- ファイル保存先（S3 の代わり） ---
# 添付ファイル・会話履歴 md の保存フォルダ
app.storage.dir=./uploads

# --- AI（Gemini API） ---
# dummy：固定の文章を返す／api：本物の Gemini API を呼ぶ（環境変数 APP_AI_MODE、初期値 dummy）
app.ai.mode=${APP_AI_MODE:dummy}
# Gemini API のキー（環境変数 GEMINI_API_KEY。ここには絶対に書かない）
app.ai.api-key=${GEMINI_API_KEY:}
