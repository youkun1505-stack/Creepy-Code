<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>プランを作っています</title>
    <link rel="stylesheet" th:href="@{/css/plan.css}">
</head>
<body>
    <!-- AIプラン生成中（P-11）。開くと plan.js が生成を頼み、できたらマイプラン（P-12）へ進む -->
    <!-- data-plan-generating：plan.js がこの画面を見分ける目印。data-generate-url に生成を頼む先を入れる -->
    <main layout:fragment="content" class="container plan-page plan-generating"
          data-plan-generating th:data-generate-url="@{/plan/generating}">

        <h1 class="plan-title">AIがプランのたたき台を作っています</h1>
        <p class="plan-lead">
            かんたん質問の答えと、AIへの相談の内容をもとに、結婚式の大まかなプランを作っています。<br>
            数秒から数十秒かかります。このままお待ちください。
        </p>

        <!-- 作っているあいだの表示 -->
        <div class="plan-generating__status" data-generating-status role="status" aria-live="polite">
            <span class="plan-generating__spinner" aria-hidden="true"></span>
            <p class="plan-generating__message" data-generating-message>プランを作っています…</p>
        </div>

        <!-- 30秒たっても終わらないとき。待ち続けてもよいし、やり直してもよい -->
        <div class="plan-notice" data-generating-slow hidden>
            <p class="plan-notice__text">
                時間がかかっています。もう少しお待ちいただくか、［やり直す］を押してください。
            </p>
            <button type="button" class="btn plan-button plan-button--primary" data-generating-retry>やり直す</button>
        </div>

        <!-- 作れなかったとき -->
        <div class="plan-notice plan-notice--error" data-generating-failed role="alert" hidden>
            <p class="plan-notice__text">
                プランを作れませんでした。［やり直す］を押して、もう一度お試しください。
            </p>
            <button type="button" class="btn plan-button plan-button--primary" data-generating-retry>やり直す</button>
        </div>

        <!-- 3回続けて作れなかったとき（基本設計書 6-5）：プランナーに作ってもらう案内 -->
        <div class="plan-notice plan-notice--error" data-generating-give-up role="alert" hidden>
            <p class="plan-notice__text">
                AIでのプランづくりが、続けてうまくいきませんでした。<br>
                お手数ですが、時間をおいてもう一度お試しください。<br>
                続けてうまくいかないときは、お店（プランナー）にたたき台づくりをご相談ください。
            </p>
            <button type="button" class="btn plan-button plan-button--secondary" data-generating-retry>
                もう一度だけ試す
            </button>
        </div>

        <noscript>
            <p class="plan-notice plan-notice--error">
                この画面は JavaScript を使います。ブラウザの設定で JavaScript を有効にしてから、もう一度開いてください。
            </p>
        </noscript>

        <p class="plan-back"><a th:href="@{/}">トップに戻る</a></p>
    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/plan.js}"></script>
    </th:block>
</body>
</html>
