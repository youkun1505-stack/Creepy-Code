<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>気になることはある？</title>
    <link rel="stylesheet" th:href="@{/css/hearing.css}">
</head>
<body>
    <!-- かんたん質問 STEP4（P-09）：タグ選択（任意）。「決められないこと」と「こだわりたいこと」を1ページで選ぶ -->
    <main layout:fragment="content" class="container hearing-page">

        <!-- 進み具合（かんたん質問の4つのステップのうち、いまどこか） -->
        <nav th:replace="~{common/hearing-progress :: progress}"></nav>

        <h1 class="hearing-title">気になることはある？</h1>
        <p class="hearing-lead">
            当てはまるものを、いくつでも選んでください。1つも選ばずに次へ進んでも大丈夫です。<br>
            選んだものは、このあとの AI との相談で参考にします。
        </p>

        <!-- data-tag-form：選んだタグに関係のありそうなタグへ「おすすめ」の印を付ける（hearing.js）。
             おすすめの組み合わせは HearingTag で決めて、各タグの data-related に入れて渡す -->
        <form class="hearing-form" th:action="@{/hearing/step4}" method="post" data-tag-form>
            <div class="hearing-tags">
                <fieldset class="hearing-tags__group">
                    <legend class="hearing-tags__title">まだ決められないこと</legend>
                    <p class="hearing-tags__lead">迷っていること・何から決めればいいかわからないこと</p>
                    <div class="hearing-tags__list">
                        <label class="hearing-tag" th:each="tag : ${undecidedTags}"
                               th:attr="data-tag-key=${tag.key()}, data-related=${tag.relatedKeys()}">
                            <input type="checkbox" class="hearing-tag__input visually-hidden" name="undecided"
                                   th:value="${tag.key()}" th:checked="${tag.checked()}">
                            <span class="hearing-tag__body">
                                <span class="hearing-tag__name" th:text="${tag.label()}">会場</span>
                                <span class="hearing-tag__description" th:text="${tag.description()}">
                                    ホテル・専門式場・レストランなど、式をする場所
                                </span>
                                <span class="hearing-tag__badge" hidden data-tag-badge>おすすめ</span>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="hearing-tags__group">
                    <legend class="hearing-tags__title">こだわりたいこと</legend>
                    <p class="hearing-tags__lead">ここは大事にしたい、と思っていること</p>
                    <div class="hearing-tags__list">
                        <label class="hearing-tag" th:each="tag : ${decidedTags}"
                               th:attr="data-tag-key=${tag.key()}, data-related=${tag.relatedKeys()}">
                            <input type="checkbox" class="hearing-tag__input visually-hidden" name="decided"
                                   th:value="${tag.key()}" th:checked="${tag.checked()}">
                            <span class="hearing-tag__body">
                                <span class="hearing-tag__name" th:text="${tag.label()}">写真・映像</span>
                                <span class="hearing-tag__description" th:text="${tag.description()}">
                                    当日の写真や動画をきれいに残す
                                </span>
                                <span class="hearing-tag__badge" hidden data-tag-badge>おすすめ</span>
                            </span>
                        </label>
                    </div>
                </fieldset>
            </div>

            <!-- おすすめの印が付いたときだけ出す説明（hearing.js） -->
            <!-- role="status"：印が付いたことを、読み上げ機器にも伝える -->
            <p class="hearing-tags__hint" role="status" hidden data-tag-hint>
                選んだものに関係がありそうなタグに「おすすめ」を付けています。当てはまれば選んでください。
            </p>

            <div class="hearing-actions">
                <a class="btn hearing-button hearing-button--secondary" th:href="@{/hearing/step3/budget}">戻る</a>
                <button type="submit" class="btn hearing-button hearing-button--primary">次へ</button>
            </div>
        </form>

    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/hearing.js}"></script>
    </th:block>
</body>
</html>
