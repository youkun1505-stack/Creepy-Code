<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>いつごろ結婚式をしたい？</title>
    <link rel="stylesheet" th:href="@{/css/hearing.css}">
</head>
<body>
    <!-- かんたん質問 STEP3（P-08）の1ページ目：希望日程。予算は次のページ（step3-budget）で聞く -->
    <main layout:fragment="content" class="container hearing-page">

        <!-- 進み具合（かんたん質問の4つのステップのうち、いまどこか） -->
        <nav th:replace="~{common/hearing-progress :: progress}"></nav>

        <p class="hearing-substep">日程と予算 1/2</p>
        <h1 class="hearing-title">いつごろ結婚式をしたい？</h1>
        <p class="hearing-lead">
            決まっていれば、希望の日付を選んでください。<br>
            まだ決まっていなくても大丈夫です。「まだ決まっていない」にチェックして、次へ進めます。
        </p>

        <!-- novalidate：ブラウザの標準のメッセージではなく、サーバーで確かめた日本語のメッセージを出すため -->
        <form class="hearing-form" th:action="@{/hearing/step3}" method="post" novalidate>
            <div class="hearing-form__summary" id="dateError" role="alert" th:if="${dateError}" th:text="${dateError}">
                明日以降の日付を選んでください
            </div>

            <div class="hearing-basic">
                <div class="hearing-field">
                    <label class="hearing-field__label" for="desiredDate">希望の日付</label>
                    <!-- data-undecided-target：「まだ決まっていない」にチェックしたら押せなくする（hearing.js） -->
                    <input type="date" id="desiredDate" name="desiredDate" class="form-control hearing-field__input"
                           th:value="${desiredDate}" th:min="${minDate}" th:max="${maxDate}"
                           th:attr="aria-invalid=${dateError != null} ? 'true' : null,
                                    aria-describedby=${dateError != null} ? 'dateError' : null"
                           data-undecided-target>
                    <label class="hearing-undecided">
                        <input type="checkbox" class="form-check-input hearing-undecided__input" name="undecided"
                               value="true" th:checked="${undecided}" data-undecided>
                        <span>まだ決まっていない</span>
                    </label>
                </div>

                <!-- 入力欄ごとの説明（知らない人が多いと思われること）。数字には出典を付ける -->
                <aside class="hearing-note" aria-labelledby="dateNoteTitle">
                    <h2 class="hearing-note__title" id="dateNoteTitle">知っておくと安心なこと</h2>
                    <ul class="hearing-note__list">
                        <li>結婚式の会場探しを始めるのは、平均で式の約10.1か月前です。</li>
                        <li>人気の会場は、春・秋や連休を中心に早く埋まりやすいといわれています。いまの時点の希望で大丈夫です。</li>
                    </ul>
                    <p class="hearing-note__source">
                        出典：ゼクシィ「準備スタート時期にありがち【結婚式のお悩み相談Q&amp;A】」（2025年10月時点。
                        平均はゼクシィ結婚トレンド調査2024）
                    </p>
                </aside>
            </div>

            <div class="hearing-actions">
                <a class="btn hearing-button hearing-button--secondary" th:href="@{/hearing/step2/result}">戻る</a>
                <button type="submit" class="btn hearing-button hearing-button--primary">次へ</button>
            </div>
        </form>

    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/hearing.js}"></script>
    </th:block>
</body>
</html>
