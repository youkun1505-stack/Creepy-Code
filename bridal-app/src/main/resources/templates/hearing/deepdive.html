<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>AI深掘り質問</title>
</head>
<body>
    <main layout:fragment="content">
        <h1 class="page-title">あなたのことを、もう少し教えてください</h1>
        <p class="page-lead">ここまでの回答をもとに、AI がいくつか質問を用意します。思ったままに答えてください。</p>

        <!-- 質問を作っている間の表示 -->
        <section th:if="${generating}" class="deepdive-loading" id="deepDiveLoading"
                 th:data-generate-url="@{/hearing/deepdive/questions}">
            <div class="deepdive-loading__waiting" id="deepDiveWaiting">
                <div class="spinner-border" role="status" aria-hidden="true"></div>
                <p class="deepdive-loading__text">AI が質問を考えています…</p>
            </div>
            <div class="alert alert-warning d-none" id="deepDiveRetry" role="alert">
                <p>時間がかかっています。もう一度お試しください。</p>
                <button type="button" class="btn btn-primary" id="deepDiveRetryButton">やり直す</button>
            </div>
            <div class="alert alert-danger d-none" id="deepDiveGiveUp" role="alert">
                質問の準備ができませんでした。お手数ですが、プランナーにプランの作成をご依頼ください。
            </div>
        </section>

        <!-- 質問と回答欄 -->
        <section th:unless="${generating}">
            <div th:if="${param.saved}" class="alert alert-success" role="alert">
                回答を保存しました。
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <form th:action="@{/hearing/deepdive}" th:object="${deepDiveForm}" method="post">
                <div class="deepdive-question" th:each="question, stat : ${questions}">
                    <label class="deepdive-question__label" th:for="${'answer' + stat.index}">
                        <span class="deepdive-question__number" th:text="${'Q' + stat.count}"></span>
                        <span th:text="${question}"></span>
                    </label>
                    <textarea class="form-control" rows="3" required
                              th:id="${'answer' + stat.index}" th:field="*{answers[__${stat.index}__]}"
                              th:maxlength="${maxAnswerLength}"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">回答を送信する</button>
            </form>
        </section>
    </main>

    <th:block layout:fragment="scripts">
        <script th:if="${generating}" th:src="@{/js/deepdive.js}"></script>
    </th:block>
</body>
</html>
