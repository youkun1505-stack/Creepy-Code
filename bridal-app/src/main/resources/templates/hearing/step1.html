<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>どんな式にしたい？</title>
    <link rel="stylesheet" th:href="@{/css/hearing.css}">
</head>
<body>
    <!-- かんたん質問 STEP1（P-06）。選ぶだけの画面なので、カードを全幅で3列×2段に並べ、説明は上に短く置く -->
    <main layout:fragment="content" class="container hearing-page">

        <!-- 進み具合（かんたん質問の4つのステップのうち、いまどこか） -->
        <nav th:replace="~{common/hearing-progress :: progress}"></nav>

        <h1 class="hearing-title">どんな式にしたい？</h1>
        <!-- STEP1 は直感で選ぶ欄なので、説明は軽く（トップページの「ご利用の流れ」にも似た説明がある） -->
        <p class="hearing-lead">
            いちばん近いものを、1つ選んでください。ぴったりでなくても大丈夫です。<br>
            あとでプランナーと相談して変えられます。
        </p>

        <!-- data-require-choice：カードを1枚選ぶまで［次へ］を押せないようにする（hearing.js）。
             押せなくするのは JS だけにして、JS が動かないときでも先に進めるようにする（空で送ったときはサーバーで止める） -->
        <form class="hearing-form" th:action="@{/hearing/step1}" method="post" data-require-choice>
            <div class="hearing-form__summary" role="alert" th:if="${choiceError}" th:text="${choiceError}">
                1つ選んでください
            </div>

            <fieldset class="hearing-cards">
                <legend class="visually-hidden">どんな式にしたい？</legend>
                <!-- カードの色は並び順で決める（hearing-card--1〜6） -->
                <label class="hearing-card" th:each="card, stat : ${archetypeCards}"
                       th:classappend="${'hearing-card--' + stat.count}">
                    <input type="radio" class="hearing-card__input visually-hidden" name="choice"
                           th:value="${card.value()}" th:checked="${card.value() == selectedChoice}">
                    <span class="hearing-card__body">
                        <span class="hearing-card__name" th:text="${card.name()}">家族や親しい人と、ゆったりと</span>
                        <span class="hearing-card__description" th:text="${card.description()}">
                            少人数で、一人ひとりとゆっくり話せる式
                        </span>
                    </span>
                </label>
            </fieldset>

            <div class="hearing-actions">
                <a class="btn hearing-button hearing-button--secondary" th:href="@{/}">トップに戻る</a>
                <button type="submit" class="btn hearing-button hearing-button--primary" data-next-button>次へ</button>
            </div>
        </form>

    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/hearing.js}"></script>
    </th:block>
</body>
</html>
