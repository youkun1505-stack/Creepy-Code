<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>パスワードの再設定</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <main layout:fragment="content" class="container auth-page">
        <div class="auth-page__grid">

            <!-- 左：案内 -->
            <aside class="auth-guide" aria-labelledby="guideTitle">
                <p class="auth-guide__eyebrow">パスワードをお忘れの方へ</p>
                <h2 class="auth-guide__title" id="guideTitle">パスワードの再設定</h2>
                <p class="auth-guide__text">
                    登録しているメールアドレスを入力して送信してください。パスワードを新しく設定するための案内をお送りします。
                </p>
                <p class="auth-guide__text">
                    案内に記載されたURLの有効期限は、申請から30分間です。
                </p>
                <div class="auth-guide__rings" aria-hidden="true"></div>
            </aside>

            <!-- 右：申請フォーム -->
            <section class="auth-card" aria-labelledby="resetTitle">
                <h1 class="auth-card__title" id="resetTitle">パスワードの再設定</h1>
                <p class="auth-card__lead">登録したメールアドレスを入力してください。</p>

                <form class="auth-form" th:action="@{/auth/password-reset}" th:object="${passwordResetRequestForm}" method="post" novalidate>
                    <div class="auth-form__summary" role="alert" th:if="${#fields.hasErrors('*')}">
                        入力内容に誤りがあります。赤字のところを確かめてください。
                    </div>

                    <div class="auth-form__field">
                        <label class="auth-form__label" for="email">メールアドレス</label>
                        <input type="email" class="form-control auth-form__input" th:field="*{email}" th:errorclass="is-invalid"
                               th:attr="aria-invalid=${#fields.hasErrors('email')}" aria-describedby="emailError"
                               autocomplete="email" maxlength="255" placeholder="例：hanako@example.com" required>
                        <p class="auth-form__error" id="emailError" th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}">メールアドレスを入力してください</p>
                    </div>

                    <button type="submit" class="btn auth-button">再設定の案内を送信</button>
                </form>

                <p class="auth-card__switch">
                    パスワードを思い出した方は<a class="auth-card__switch-link" th:href="@{/auth/login}">ログイン画面へ</a>
                </p>
            </section>

        </div>
    </main>
</body>
</html>
