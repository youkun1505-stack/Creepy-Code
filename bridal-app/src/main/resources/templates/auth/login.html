<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>ログイン</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <!-- 会員登録（P-02）と同じ「左：説明／右：フォーム」の骨格。横幅は Bootstrap の .container に任せる -->
    <main layout:fragment="content" class="container auth-page">
        <div class="auth-page__grid">

            <!-- 左：まだ会員でない方への案内 -->
            <aside class="auth-guide" aria-labelledby="guideTitle">
                <p class="auth-guide__eyebrow">はじめての方へ</p>
                <h2 class="auth-guide__title" id="guideTitle">登録すると、できること</h2>
                <!-- 「登録すると、できること」の3つは、会員登録（P-02）と共通の部品 -->
                <ul th:replace="~{common/auth-merit :: merit}"></ul>
                <p class="auth-guide__text">登録は、氏名・メールアドレス・パスワードを入力するだけです。</p>
                <a class="btn auth-button auth-button--secondary" th:href="@{${registerUrl}}">会員登録してはじめる</a>
                <div class="auth-guide__rings" aria-hidden="true"></div>
            </aside>

            <!-- 右：ログインのフォーム -->
            <section class="auth-card" aria-labelledby="loginTitle">
                <h1 class="auth-card__title" id="loginTitle">ログイン</h1>
                <p class="auth-card__lead">登録したメールアドレスとパスワードを入力してください。</p>

                <!-- 入力チェックはサーバー側で行い、メッセージの出し方をそろえるため、ブラウザの入力チェック（吹き出し）は止めている -->
                <form class="auth-form" th:action="@{/auth/login}" th:object="${loginForm}" method="post" novalidate>
                    <!-- ログインに失敗したとき。どちらが間違っているかは教えない（基本設計書 6-2） -->
                    <div class="auth-form__summary" role="alert" th:if="${#fields.hasGlobalErrors()}"
                         th:text="${#fields.globalErrors()[0]}">メールアドレスまたはパスワードが正しくありません</div>
                    <!-- 未入力のとき（'*' にはログイン失敗のエラーも含まれるので、失敗のときは出さない） -->
                    <div class="auth-form__summary" role="alert" th:if="${#fields.hasErrors('*') and !#fields.hasGlobalErrors()}">
                        入力内容に誤りがあります。赤字のところを確かめてください。
                    </div>

                    <div class="auth-form__field">
                        <label class="auth-form__label" for="email">メールアドレス</label>
                        <input type="email" class="form-control auth-form__input" th:field="*{email}" th:errorclass="is-invalid"
                               th:attr="aria-invalid=${#fields.hasErrors('email')}" aria-describedby="emailError"
                               autocomplete="username" maxlength="255" placeholder="例：hanako@example.com" required>
                        <p class="auth-form__error" id="emailError" th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}">メールアドレスを入力してください</p>
                    </div>

                    <div class="auth-form__field">
                        <label class="auth-form__label" for="password">パスワード</label>
                        <div class="auth-form__password">
                            <input type="password" class="form-control auth-form__input" th:field="*{password}" th:errorclass="is-invalid"
                                   th:attr="aria-invalid=${#fields.hasErrors('password')}" aria-describedby="passwordError"
                                   autocomplete="current-password" required>
                            <button type="button" class="auth-form__toggle" data-toggle-password="password"
                                    aria-controls="password" aria-label="パスワードを表示">表示</button>
                        </div>
                        <p class="auth-form__error" id="passwordError" th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}">パスワードを入力してください</p>
                        <p class="auth-form__forgot">
                            <a class="auth-form__forgot-link" th:href="@{${passwordResetUrl}}">パスワードを忘れた方はこちら</a>
                        </p>
                    </div>

                    <button type="submit" class="btn auth-button">ログイン</button>
                </form>

                <p class="auth-card__switch">はじめての方は<a class="auth-card__switch-link" th:href="@{${registerUrl}}">会員登録</a></p>
            </section>

        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/auth.js}"></script>
    </th:block>
</body>
</html>
