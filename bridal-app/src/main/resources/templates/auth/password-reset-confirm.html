<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>新しいパスワードの設定</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <main layout:fragment="content" class="container auth-page">
        <div class="auth-page__grid">

            <!-- 左：案内 -->
            <aside class="auth-guide" aria-labelledby="guideTitle">
                <p class="auth-guide__eyebrow">パスワードをお忘れの方へ</p>
                <h2 class="auth-guide__title" id="guideTitle">新しいパスワードの設定</h2>
                <p class="auth-guide__text">
                    安全のため、半角英字と数字の両方を含めた8文字以上のパスワードを設定してください。
                </p>
                <div class="auth-guide__rings" aria-hidden="true"></div>
            </aside>

            <!-- 右：再設定フォーム -->
            <section class="auth-card" aria-labelledby="resetTitle">
                <h1 class="auth-card__title" id="resetTitle">パスワードの再設定</h1>
                <p class="auth-card__lead">新しいパスワードを入力してください。</p>

                <form class="auth-form" th:action="@{/auth/password-reset/confirm}" th:object="${passwordResetConfirmForm}" method="post" novalidate>
                    <!-- グローバルエラー（パスワード不一致など） -->
                    <div class="auth-form__summary" role="alert" th:if="${#fields.hasGlobalErrors()}"
                         th:text="${#fields.globalErrors()[0]}">入力内容に誤りがあります。</div>
                    <div class="auth-form__summary" role="alert" th:if="${#fields.hasErrors('*') and !#fields.hasGlobalErrors()}">
                        入力内容に誤りがあります。赤字のところを確かめてください。
                    </div>

                    <input type="hidden" th:field="*{token}">

                    <div class="auth-form__field">
                        <label class="auth-form__label" for="password">新しいパスワード</label>
                        <div class="auth-form__password">
                            <input type="password" class="form-control auth-form__input" th:field="*{password}" th:errorclass="is-invalid"
                                   th:attr="aria-invalid=${#fields.hasErrors('password')}" aria-describedby="passwordError"
                                   autocomplete="new-password" maxlength="72" required>
                            <button type="button" class="auth-form__toggle" data-toggle-password="password"
                                    aria-controls="password" aria-label="パスワードを表示">表示</button>
                        </div>
                        <p class="auth-form__hint">半角英字と数字の両方を含む8文字以上</p>
                        <p class="auth-form__error" id="passwordError" th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}">パスワードを入力してください</p>
                    </div>

                    <div class="auth-form__field">
                        <label class="auth-form__label" for="passwordConfirm">パスワード（確認用）</label>
                        <div class="auth-form__password">
                            <input type="password" class="form-control auth-form__input" th:field="*{passwordConfirm}" th:errorclass="is-invalid"
                                   th:attr="aria-invalid=${#fields.hasErrors('passwordConfirm')}" aria-describedby="passwordConfirmError"
                                   autocomplete="new-password" maxlength="72" required>
                            <button type="button" class="auth-form__toggle" data-toggle-password="passwordConfirm"
                                    aria-controls="passwordConfirm" aria-label="パスワードを表示">表示</button>
                        </div>
                        <p class="auth-form__error" id="passwordConfirmError" th:if="${#fields.hasErrors('passwordConfirm')}"
                           th:errors="*{passwordConfirm}">確認用のパスワードを入力してください</p>
                    </div>

                    <button type="submit" class="btn auth-button">パスワードを変更する</button>
                </form>
            </section>

        </div>
    </main>
</body>
</html>
