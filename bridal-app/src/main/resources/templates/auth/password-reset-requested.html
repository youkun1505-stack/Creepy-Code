<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>再設定のご案内を送信しました</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <main layout:fragment="content" class="container auth-page">
        <div class="auth-page__grid">

            <!-- 左：案内 -->
            <aside class="auth-guide" aria-labelledby="guideTitle">
                <p class="auth-guide__eyebrow">パスワードをお忘れの方へ</p>
                <h2 class="auth-guide__title" id="guideTitle">メールをご確認ください</h2>
                <p class="auth-guide__text">
                    メールが見当たらない場合は、迷惑メールフォルダをご確認いただくか、入力したメールアドレスに誤りがないか再度お確かめください。
                </p>
                <div class="auth-guide__rings" aria-hidden="true"></div>
            </aside>

            <!-- 右：完了案内 -->
            <section class="auth-card" aria-labelledby="completeTitle">
                <h1 class="auth-card__title" id="completeTitle">ご案内を送信しました</h1>
                <p class="auth-card__lead">
                    入力されたメールアドレス宛に、パスワード再設定用の案内を送信しました。
                </p>
                <p class="auth-form__text mb-4">
                    メールに記載されたURLから、30分以内に新しいパスワードの設定を完了してください。
                </p>

                <!-- 発表・デモ用：ローカル環境（メール非送信）用の直接リンク枠 -->
                <div class="alert alert-info mt-3 mb-4" th:if="${demoResetUrl != null}">
                    <p class="fw-bold mb-1">【発表・動作確認用のご案内】</p>
                    <p class="small mb-2">本環境ではメール送信を行わず、ログに出力しています。以下のリンクから再設定画面へ直接進むことができます。</p>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{${demoResetUrl}}">パスワード再設定画面を開く</a>
                </div>

                <a class="btn auth-button auth-button--secondary mt-2" th:href="@{/auth/login}">ログイン画面へ戻る</a>
            </section>

        </div>
    </main>
</body>
</html>
