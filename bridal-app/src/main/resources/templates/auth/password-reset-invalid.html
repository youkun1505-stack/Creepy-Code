<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>リンクが無効です</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <main layout:fragment="content" class="container auth-page">
        <div class="auth-page__grid">

            <!-- 左：案内 -->
            <aside class="auth-guide" aria-labelledby="guideTitle">
                <p class="auth-guide__eyebrow">パスワード再設定</p>
                <h2 class="auth-guide__title" id="guideTitle">有効期限切れまたは使用済み</h2>
                <p class="auth-guide__text">
                    パスワード再設定用リンクの有効期限は申請から30分間です。すでに使用されたリンクもご利用いただけません。
                </p>
                <div class="auth-guide__rings" aria-hidden="true"></div>
            </aside>

            <!-- 右：エラー案内 -->
            <section class="auth-card" aria-labelledby="invalidTitle">
                <h1 class="auth-card__title" id="invalidTitle">リンクが無効です</h1>
                <p class="auth-card__lead text-danger">
                    指定されたURLは有効期限が切れているか、すでに使用されています。
                </p>
                <p class="auth-form__text mb-4">
                    お手数ですが、もう一度最初からパスワードの再設定を申請してください。
                </p>

                <div class="d-flex flex-column gap-2">
                    <a class="btn auth-button" th:href="@{/auth/password-reset}">もう一度申請する</a>
                    <a class="btn auth-button auth-button--secondary" th:href="@{/auth/login}">ログイン画面へ</a>
                </div>
            </section>

        </div>
    </main>
</body>
</html>
